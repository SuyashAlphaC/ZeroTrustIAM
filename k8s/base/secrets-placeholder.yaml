apiVersion: v1
kind: Secret
metadata:
  name: ztiam-secrets
  namespace: ztiam
type: Opaque
stringData:
  # DATABASE_URL password segment must match POSTGRES_PASSWORD.
  DATABASE_URL: "postgresql://ztiam:replace-me@postgres:5432/ztiam"
  POSTGRES_PASSWORD: "replace-me"
  JWT_SECRET: "replace-me"
  JWT_REFRESH_SECRET: "replace-me"
  OAUTH_DEFAULT_CLIENT_SECRET: "replace-me"
  APP_ENCRYPTION_KEY: "replace-me"
  ML_SERVICE_TOKEN: "replace-me"
