# ExternalSecrets: sync ztiam-secrets from Vault KV (ClusterSecretStore: vault-backend).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ztiam-secrets
  namespace: ztiam
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ztiam-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/ztiam/production
        property: DATABASE_URL
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: secret/ztiam/production
        property: POSTGRES_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/ztiam/production
        property: JWT_SECRET
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: secret/ztiam/production
        property: JWT_REFRESH_SECRET
    - secretKey: OAUTH_DEFAULT_CLIENT_SECRET
      remoteRef:
        key: secret/ztiam/production
        property: OAUTH_DEFAULT_CLIENT_SECRET
    - secretKey: APP_ENCRYPTION_KEY
      remoteRef:
        key: secret/ztiam/production
        property: APP_ENCRYPTION_KEY
    - secretKey: ML_SERVICE_TOKEN
      remoteRef:
        key: secret/ztiam/production
        property: ML_SERVICE_TOKEN
