apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-models
  namespace: ztiam
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  namespace: ztiam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-service
  template:
    metadata:
      labels:
        app: ml-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: ml-service
          image: ztiam/ml-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          env:
            - name: MODEL_DIR
              value: /app/models
            - name: ML_DATASET_PATH
              value: /app/models/training_samples.db
            - name: ML_RETRAIN_INTERVAL_MINUTES
              value: "30"
            - name: ML_RETRAIN_MIN_NEW_SAMPLES
              value: "50"
            - name: ML_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ztiam-secrets
                  key: ML_SERVICE_TOKEN
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: models
              mountPath: /app/models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ml-models
---
apiVersion: v1
kind: Service
metadata:
  name: ml-service
  namespace: ztiam
spec:
  ports:
    - port: 5000
      targetPort: 5000
  selector:
    app: ml-service
