# Default-deny baseline plus least-privilege allowlists per workload.
# Requires a NetworkPolicy-aware CNI (Calico / Cilium / Weave). See
# k8s/NETWORK_POLICIES.md for the traffic graph and testing recipe.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: ztiam
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Permit DNS resolution to CoreDNS in kube-system. Without this every other
# egress rule fails because pods cannot resolve service names.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: ztiam
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-app-policy
  namespace: ztiam
spec:
  podSelector:
    matchLabels:
      app: web-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: policy-engine
      ports:
        - protocol: TCP
          port: 4000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: policy-engine-policy
  namespace: ztiam
spec:
  podSelector:
    matchLabels:
      app: policy-engine
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web-app
        - podSelector:
            matchLabels:
              app: prometheus
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 4000
  egress:
    # PgBouncer (writer + reader pools) — both Pooler types share label
    # cnpg.io/poolerName.
    - to:
        - podSelector:
            matchExpressions:
              - key: cnpg.io/poolerName
                operator: In
                values: ["ztiam-pg-rw", "ztiam-pg-ro"]
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: ml-service
      ports:
        - protocol: TCP
          port: 5000
    - to:
        - podSelector:
            matchLabels:
              app: vault
      ports:
        - protocol: TCP
          port: 8200
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # Hyperledger Fabric peers (external network labelled fabric_iam=true).
    - to:
        - namespaceSelector:
            matchLabels:
              fabric_iam: "true"
      ports:
        - protocol: TCP
          port: 7051
    # OpenTelemetry collector / Jaeger OTLP HTTP.
    - to:
        - podSelector:
            matchLabels:
              app: jaeger
        - podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - protocol: TCP
          port: 4318
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ml-service-policy
  namespace: ztiam
spec:
  podSelector:
    matchLabels:
      app: ml-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: policy-engine
        - podSelector:
            matchLabels:
              app: prometheus
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 5000
  # No egress block — only the blanket DNS rule above applies. The model
  # service must not be able to phone home or pull external data.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-policy
  namespace: ztiam
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: policy-engine
      ports:
        - protocol: TCP
          port: 6379
  # Egress: nothing beyond DNS (allow-dns-egress).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pgbouncer-policy
  namespace: ztiam
spec:
  podSelector:
    matchExpressions:
      - key: cnpg.io/poolerName
        operator: In
        values: ["ztiam-pg-rw", "ztiam-pg-ro"]
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: policy-engine
      ports:
        - protocol: TCP
          port: 5432
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: ztiam-pg
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cnpg-cluster-policy
  namespace: ztiam
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: ztiam-pg
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: cnpg.io/poolerName
                operator: In
                values: ["ztiam-pg-rw", "ztiam-pg-ro"]
        # cnpg-controller-manager runs in cnpg-system by convention.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
        # Other cluster members (replication, election).
        - podSelector:
            matchLabels:
              cnpg.io/cluster: ztiam-pg
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 9187
  egress:
    # Replication, lease, and metrics traffic to siblings.
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: ztiam-pg
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-policy
  namespace: ztiam
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: policy-engine
      ports:
        - protocol: TCP
          port: 4000
    - to:
        - podSelector:
            matchLabels:
              app: ml-service
      ports:
        - protocol: TCP
          port: 5000
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: ztiam-pg
      ports:
        - protocol: TCP
          port: 9187
    - to:
        - podSelector:
            matchExpressions:
              - key: cnpg.io/poolerName
                operator: In
                values: ["ztiam-pg-rw", "ztiam-pg-ro"]
      ports:
        - protocol: TCP
          port: 9127
