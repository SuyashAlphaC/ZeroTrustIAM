# Example SealedSecret for ztiam-secrets — encrypt with kubeseal (do not commit raw values).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ztiam-secrets
  namespace: ztiam
spec:
  encryptedData:
    DATABASE_URL: AgB7kubeseal-encrypted-blob-replace-me
    POSTGRES_PASSWORD: AgB7kubeseal-encrypted-blob-replace-me
    JWT_SECRET: AgB7kubeseal-encrypted-blob-replace-me
    JWT_REFRESH_SECRET: AgB7kubeseal-encrypted-blob-replace-me
    OAUTH_DEFAULT_CLIENT_SECRET: AgB7kubeseal-encrypted-blob-replace-me
    APP_ENCRYPTION_KEY: AgB7kubeseal-encrypted-blob-replace-me
    ML_SERVICE_TOKEN: AgB7kubeseal-encrypted-blob-replace-me
  template:
    metadata:
      name: ztiam-secrets
      namespace: ztiam
    type: Opaque
