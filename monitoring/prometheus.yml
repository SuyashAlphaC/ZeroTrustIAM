global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: ml-service
    metrics_path: /metrics
    static_configs:
      - targets: ['ml-service:5000']

  - job_name: policy-engine
    metrics_path: /metrics
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['policy-engine:4000']
