# Nginx snippet — ZeroTrustIAM PEP via auth_request
# Requires a sidecar running packages/gateway-plugins/envoy-ext-authz/server.js
# or any service that returns 200/401 based on Authorization bearer.

location = /_ztiam_auth {
  internal;
  proxy_pass http://127.0.0.1:9001/check;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Authorization $http_authorization;
  proxy_set_header X-Original-URI $request_uri;
}

location /api/ {
  auth_request /_ztiam_auth;
  auth_request_set $ztiam_user $upstream_http_x_ztiam_sub;
  proxy_set_header X-Ztiam-Sub $ztiam_user;
  proxy_pass http://backend;
}
