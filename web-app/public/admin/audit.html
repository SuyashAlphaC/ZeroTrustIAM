<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Audit Log · ZeroTrust IAM</title>
  <link rel="stylesheet" href="/styles/ztiam.css">
</head>
<body>
<script type="module">
  import { requireRole } from '/js/auth.js';
  import {
    renderShell, pageHead, decisionPill, riskGauge, hashCopy,
    fmtTime, fmtRelative, fmtLocalTime, toast, escape,
  } from '/js/ui.js';
  import { get, post } from '/js/api.js';

  await requireRole('admin');
  const main = renderShell({ section: 'admin', currentPath: '/admin/audit' });
  main.innerHTML = pageHead({
    crumb: 'Governance / Audit',
    title: '<em>Audit</em> log',
    description: 'Access decisions and admin lifecycle events from the policy engine audit store (mirrored with Fabric when available).',
    actions: `<button class="btn btn-secondary" id="refresh">Refresh</button>
              <button class="btn btn-primary" id="export">Export CSV</button>`,
  }) + `
    <div class="filters">
      <div class="field">
        <label class="field-label" for="f-user">User</label>
        <input class="input" id="f-user" placeholder="username or sub">
      </div>
      <div class="field">
        <label class="field-label" for="f-decision">Decision</label>
        <select class="select" id="f-decision">
          <option value="">All</option>
          <option value="ALLOW">ALLOW</option>
          <option value="DENY">DENY</option>
          <option value="MFA_REQUIRED">MFA_REQUIRED</option>
          <option value="STEP_UP">STEP_UP</option>
          <option value="MFA_DISABLED">MFA_DISABLED</option>
          <option value="DEVICE_REGISTERED">DEVICE_REGISTERED</option>
          <option value="USER_SUSPENDED">USER_SUSPENDED</option>
          <option value="USER_EVICTED">USER_EVICTED</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label" for="f-from">From</label>
        <input class="input" id="f-from" type="datetime-local">
      </div>
      <div class="field">
        <label class="field-label" for="f-to">To</label>
        <input class="input" id="f-to" type="datetime-local">
      </div>
      <div class="field">
        <label class="field-label" for="f-min">Min risk</label>
        <input class="input" id="f-min" type="number" step="0.05" min="0" max="1" placeholder="0.00">
      </div>
      <div class="field">
        <label class="field-label" for="f-max">Max risk</label>
        <input class="input" id="f-max" type="number" step="0.05" min="0" max="1" placeholder="1.00">
      </div>
      <div class="field-actions">
        <button class="btn btn-secondary" id="apply">Apply</button>
        <button class="btn btn-ghost" id="clear">Clear</button>
      </div>
    </div>

    <div id="result"></div>`;

  const $ = (s) => document.querySelector(s);
  const result = $('#result');
  let allRows = [];
  let sortKey = 'timestamp';
  let sortDir = 'desc';

  function rowTs(r) {
    return r.timestamp || r.createdAt || r.created_at || r.ts || null;
  }
  function rowUser(r) {
    return r.userId || r.user_id || r.user || null;
  }
  function rowTx(r) {
    return r.txId || r.tx_id || null;
  }
  function rowRisk(r) {
    const v = r.riskScore ?? r.risk_score ?? r.risk;
    return v == null || v === '' ? null : Number(v);
  }
  function rowDevice(r) {
    return r.deviceId || r.device_id || null;
  }

  async function load() {
    result.innerHTML = `<div class="empty"><p>Loading audit entries…</p></div>`;
    try {
      const data = await get('/api/admin/audit?limit=200');
      allRows = Array.isArray(data)
        ? data
        : (data.entries || data.rows || data.audit || []);
      render();
    } catch (err) {
      result.innerHTML = `<div class="empty"><h3>Couldn't load audit log</h3><p>${escape(err.message)}</p></div>`;
    }
  }

  function applyFilters(rows) {
    const user = $('#f-user').value.trim().toLowerCase();
    const dec = $('#f-decision').value;
    const from = $('#f-from').value ? new Date($('#f-from').value).getTime() : null;
    const to = $('#f-to').value ? new Date($('#f-to').value).getTime() : null;
    const minR = $('#f-min').value === '' ? null : parseFloat($('#f-min').value);
    const maxR = $('#f-max').value === '' ? null : parseFloat($('#f-max').value);
    return rows.filter((r) => {
      const uname = (rowUser(r) || '').toLowerCase();
      if (user && !uname.includes(user)) return false;
      if (dec && r.decision !== dec) return false;
      const t = new Date(rowTs(r) || 0).getTime();
      if (from && (!Number.isFinite(t) || t < from)) return false;
      if (to && (!Number.isFinite(t) || t > to)) return false;
      const risk = rowRisk(r);
      if (minR != null && Number.isFinite(risk) && risk < minR) return false;
      if (maxR != null && Number.isFinite(risk) && risk > maxR) return false;
      // If filtering by risk, hide non-scored lifecycle rows unless both bounds empty
      if ((minR != null || maxR != null) && risk == null) return false;
      return true;
    });
  }

  function sortRows(rows) {
    const dir = sortDir === 'asc' ? 1 : -1;
    return [...rows].sort((a, b) => {
      let av;
      let bv;
      if (sortKey === 'timestamp') {
        av = new Date(rowTs(a) || 0).getTime();
        bv = new Date(rowTs(b) || 0).getTime();
        return (av - bv) * dir;
      }
      if (sortKey === 'userId') {
        av = rowUser(a) || '';
        bv = rowUser(b) || '';
        return String(av).localeCompare(String(bv)) * dir;
      }
      if (sortKey === 'riskScore') {
        av = rowRisk(a);
        bv = rowRisk(b);
        if (av == null && bv == null) return 0;
        if (av == null) return 1 * dir;
        if (bv == null) return -1 * dir;
        return (av - bv) * dir;
      }
      av = a[sortKey];
      bv = b[sortKey];
      return String(av || '').localeCompare(String(bv || '')) * dir;
    });
  }

  function render() {
    const rows = sortRows(applyFilters(allRows));
    if (!rows.length) {
      result.innerHTML = `<div class="empty"><h3>No matching entries</h3><p>Adjust filters or wait for new traffic.</p></div>`;
      return;
    }
    result.innerHTML = `
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th class="sortable ${sortKey==='timestamp'?'sort-'+sortDir:''}" data-sort="timestamp">When</th>
              <th class="sortable ${sortKey==='userId'?'sort-'+sortDir:''}" data-sort="userId">User</th>
              <th>Decision</th>
              <th class="sortable ${sortKey==='riskScore'?'sort-'+sortDir:''}" data-sort="riskScore">Risk</th>
              <th>Reason</th>
              <th>Layer</th>
              <th>Device</th>
              <th>Tx</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${rows.map((r, i) => rowHtml(r, i)).join('')}
          </tbody>
        </table>
      </div>
      <div class="t-small text-fg-2 mt-3">${rows.length} of ${allRows.length} entries · sorted by ${sortKey} ${sortDir}</div>
    `;
    bindRows(rows);
  }

  function rowHtml(r, i) {
    const ts = rowTs(r);
    const user = rowUser(r);
    const tx = rowTx(r);
    const risk = rowRisk(r);
    const device = rowDevice(r);
    const auditId = r.auditId || tx || r.id;
    return `
      <tr data-i="${i}" data-id="${escape(auditId != null ? String(auditId) : '')}">
        <td>
          <div>${escape(fmtLocalTime(ts))}</div>
          <div class="t-small text-fg-2">${escape(fmtRelative(ts))}</div>
          <div class="t-mono text-fg-3" style="font-size:10px">${escape(fmtTime(ts))}</div>
        </td>
        <td><span class="t-mono">${escape(user || '—')}</span></td>
        <td>${decisionPill(r.decision)}</td>
        <td class="num">${risk != null && Number.isFinite(risk) ? riskGauge(risk) : '<span class="t-mono text-fg-2">—</span>'}</td>
        <td><span class="t-small">${escape(r.reason || '—')}</span></td>
        <td><span class="t-small text-fg-2">${escape(r.layer || '—')}</span></td>
        <td><span class="t-mono" style="font-size:11px" title="${escape(device || '')}">${escape(device ? (device.length > 14 ? device.slice(0, 12) + '…' : device) : '—')}</span></td>
        <td>${tx ? hashCopy(tx, { length: 12 }) : '<span class="t-mono text-fg-2">—</span>'}</td>
        <td><button class="btn btn-ghost btn-sm" data-act="expand">Details</button></td>
      </tr>`;
  }

  function detailHtml(r) {
    const ts = rowTs(r);
    const user = rowUser(r);
    const tx = rowTx(r);
    const risk = rowRisk(r);
    const device = rowDevice(r);
    const meta = r.metadata;
    return `
      <tr class="row-detail">
        <td colspan="9">
          <div class="grid" style="display:grid;grid-template-columns:1fr 1fr;gap:var(--s-5)">
            <div>
              <div class="t-h3 mb-3">Entry</div>
              <dl>
                <div class="detail-row"><dt>When (local)</dt><dd>${escape(fmtLocalTime(ts))}</dd></div>
                <div class="detail-row"><dt>When (UTC)</dt><dd class="t-mono">${escape(fmtTime(ts))}</dd></div>
                <div class="detail-row"><dt>User</dt><dd class="t-mono">${escape(user || '—')}</dd></div>
                <div class="detail-row"><dt>Device</dt><dd class="t-mono">${escape(device || '—')}</dd></div>
                <div class="detail-row"><dt>Decision</dt><dd>${decisionPill(r.decision)}</dd></div>
                <div class="detail-row"><dt>Reason</dt><dd>${escape(r.reason || '—')}</dd></div>
                <div class="detail-row"><dt>Layer</dt><dd class="t-mono">${escape(r.layer || '—')}</dd></div>
                <div class="detail-row"><dt>Risk score</dt><dd>${risk != null && Number.isFinite(risk) ? riskGauge(risk) : '—'}</dd></div>
                <div class="detail-row"><dt>Tx ID</dt><dd>${tx ? hashCopy(tx, { length: 32 }) : '—'}</dd></div>
                <div class="detail-row"><dt>Record id</dt><dd class="t-mono">${escape(r.id != null ? String(r.id) : '—')}</dd></div>
              </dl>
            </div>
            <div>
              <div class="t-h3 mb-3">Metadata</div>
              ${meta
                ? `<pre class="t-mono t-small" style="white-space:pre-wrap;word-break:break-all;background:var(--bg-2);padding:var(--s-4);border-radius:var(--radius)">${escape(typeof meta === 'string' ? meta : JSON.stringify(meta, null, 2))}</pre>`
                : '<p class="t-small text-fg-2">No metadata on this entry.</p>'}
              <div class="flex gap-2 mt-5 justify-end">
                <span class="t-small text-fg-2 flex items-center" style="margin-right:auto">Label for ML training (access decisions)</span>
                <button class="btn btn-secondary" data-fb="false_positive">False positive</button>
                <button class="btn btn-secondary" data-fb="true_positive">True positive</button>
              </div>
            </div>
          </div>
        </td>
      </tr>`;
  }

  function bindRows(rows) {
    document.querySelectorAll('th.sortable').forEach((th) => {
      th.addEventListener('click', () => {
        const k = th.dataset.sort;
        if (sortKey === k) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
        else { sortKey = k; sortDir = 'desc'; }
        render();
      });
    });
    document.querySelectorAll('button[data-act=expand]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const tr = btn.closest('tr');
        const i = Number(tr.dataset.i);
        const next = tr.nextElementSibling;
        if (next && next.classList.contains('row-detail')) {
          next.remove();
          tr.classList.remove('expanded');
          btn.textContent = 'Details';
          return;
        }
        tr.classList.add('expanded');
        btn.textContent = 'Hide';
        tr.insertAdjacentHTML('afterend', detailHtml(rows[i]));
        const detail = tr.nextElementSibling;
        detail.querySelectorAll('button[data-fb]').forEach((b) => {
          b.addEventListener('click', async () => {
            const auditId = tr.dataset.id;
            if (!auditId) { toast('No audit id for feedback', 'error'); return; }
            try {
              await post(`/api/admin/audit/${encodeURIComponent(auditId)}/feedback`, {
                label: b.dataset.fb,
              });
              toast('Feedback recorded', 'success');
            } catch (err) { toast(err.message, 'error'); }
          });
        });
      });
    });
  }

  $('#refresh').addEventListener('click', load);
  $('#apply').addEventListener('click', render);
  $('#clear').addEventListener('click', () => {
    document.querySelectorAll('.filters input, .filters select').forEach((el) => { el.value = ''; });
    render();
  });
  $('#export').addEventListener('click', () => {
    const rows = applyFilters(allRows);
    const csv = ['timestamp,user,decision,risk,reason,layer,deviceId,txId']
      .concat(rows.map((r) => [
        rowTs(r) || '',
        rowUser(r) || '',
        r.decision || '',
        rowRisk(r) ?? '',
        JSON.stringify(r.reason || ''),
        JSON.stringify(r.layer || ''),
        rowDevice(r) || '',
        rowTx(r) || '',
      ].join(','))).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'audit-' + Date.now() + '.csv';
    a.click();
  });

  load();
</script>
</body>
</html>
