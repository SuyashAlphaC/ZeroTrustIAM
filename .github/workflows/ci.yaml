name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  policy-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: policy-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: policy-engine/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint (best-effort)
        run: npx --yes eslint . || true
      - name: Test
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt
          JWT_REFRESH_SECRET: test-refresh
          OAUTH_DEFAULT_CLIENT_SECRET: test-client
          ML_SERVICE_ENABLED: "false"
        run: npm test

  ml-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Test
        run: pytest -q

  chaincode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chaincode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Lint (best-effort)
        run: npx --yes eslint . || true

  docker-build:
    runs-on: ubuntu-latest
    needs: [policy-engine, ml-service]
    steps:
      - uses: actions/checkout@v4
      - name: Build ml-service image
        run: docker build -t ztiam/ml-service:ci ./ml-service
      - name: Build policy-engine image
        run: docker build -t ztiam/policy-engine:ci ./policy-engine
      - name: Build web-app image
        run: docker build -t ztiam/web-app:ci ./web-app
