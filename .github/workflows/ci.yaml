name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  policy-engine:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ztiam_test
          POSTGRES_USER: ztiam
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ztiam -d ztiam_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: policy-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: policy-engine/package-lock.json
      - name: Install
        run: npm ci
      - name: ESLint
        run: npx --yes eslint .
      - name: npm audit (production, critical-only)
        run: npm audit --omit=dev --audit-level=critical
      - name: Test
        env:
          NODE_ENV: test
          FABRIC_TEST_MODE: "true"
          JWT_SECRET: test-jwt-secret-minimum-32chars-xx
          JWT_REFRESH_SECRET: test-refresh-secret-minimum32chxx
          OAUTH_DEFAULT_CLIENT_SECRET: test-client-secret
          ML_SERVICE_ENABLED: "false"
          TEST_DATABASE_URL: postgresql://ztiam:testpassword@localhost:5432/ztiam_test
        run: npm test

  ml-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit
      - name: pip-audit
        run: pip-audit --requirement requirements.txt --severity medium
      - name: Test
        run: pytest -q

  chaincode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chaincode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: chaincode/package-lock.json
      - name: Install
        run: npm ci
      - name: ESLint
        run: npx --yes eslint .
      - name: Test
        run: npm test
      - name: Coverage gate
        run: npm run test:coverage
      - name: JavaScript syntax check
        run: node --check index.js && node --check lib/iamContract.js

  web-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - name: Install
        run: npm ci
      - name: ESLint
        run: npx --yes eslint .
      - name: npm audit (production, critical-only)
        run: npm audit --omit=dev --audit-level=critical
      - name: Test
        run: npm test

  docker-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [policy-engine, ml-service, chaincode, web-app]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata — ml-service
        id: meta-ml
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/ztiam-ml-service
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - name: Build & push ml-service
        uses: docker/build-push-action@v5
        with:
          context: ./ml-service
          push: true
          tags: ${{ steps.meta-ml.outputs.tags }}
          labels: ${{ steps.meta-ml.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker metadata — policy-engine
        id: meta-pe
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/ztiam-policy-engine
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - name: Build & push policy-engine
        uses: docker/build-push-action@v5
        with:
          context: ./policy-engine
          push: true
          tags: ${{ steps.meta-pe.outputs.tags }}
          labels: ${{ steps.meta-pe.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker metadata — web-app
        id: meta-wa
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/ztiam-web-app
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - name: Build & push web-app
        uses: docker/build-push-action@v5
        with:
          context: ./web-app
          push: true
          tags: ${{ steps.meta-wa.outputs.tags }}
          labels: ${{ steps.meta-wa.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [policy-engine, ml-service, chaincode, web-app]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ml-service (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./ml-service
          push: false
          cache-from: type=gha
      - name: Build policy-engine (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./policy-engine
          push: false
          cache-from: type=gha
      - name: Build web-app (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./web-app
          push: false
          cache-from: type=gha
