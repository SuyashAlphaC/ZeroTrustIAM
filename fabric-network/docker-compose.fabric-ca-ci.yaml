# Minimal Fabric CA stack for CI — multi-org (orderer + org1 + org2)
# Usage: docker compose -f fabric-network/docker-compose.fabric-ca-ci.yaml up -d

services:
  ca-org1:
    image: hyperledger/fabric-ca:1.5
    container_name: ztiam-ca-org1
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org1
      - FABRIC_CA_SERVER_TLS_ENABLED=false
      - FABRIC_CA_SERVER_PORT=7054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:17054
    ports:
      - "17054:7054"
    command: sh -c "fabric-ca-server start -b admin:adminpw -d"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7054"]
      interval: 5s
      timeout: 3s
      retries: 15

  ca-org2:
    image: hyperledger/fabric-ca:1.5
    container_name: ztiam-ca-org2
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org2
      - FABRIC_CA_SERVER_TLS_ENABLED=false
      - FABRIC_CA_SERVER_PORT=7054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:17054
    ports:
      - "17055:7054"
    command: sh -c "fabric-ca-server start -b admin:adminpw -d"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7054"]
      interval: 5s
      timeout: 3s
      retries: 15

  ca-orderer:
    image: hyperledger/fabric-ca:1.5
    container_name: ztiam-ca-orderer
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-orderer
      - FABRIC_CA_SERVER_TLS_ENABLED=false
      - FABRIC_CA_SERVER_PORT=7054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:17054
    ports:
      - "17056:7054"
    command: sh -c "fabric-ca-server start -b admin:adminpw -d"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7054"]
      interval: 5s
      timeout: 3s
      retries: 15
